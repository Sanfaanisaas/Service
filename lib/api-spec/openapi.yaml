openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: customers
  - name: charging
  - name: workspace
  - name: inventory
  - name: sales
  - name: transactions
  - name: receipts
  - name: history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the operational dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /charging:
    get:
      operationId: listChargingSessions
      tags: [charging]
      summary: List active charging sessions
      responses:
        "200":
          description: Charging sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChargingSession"
  /charging/check-in:
    post:
      operationId: checkInChargingSession
      tags: [charging]
      summary: Check a device into charging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargingCheckInInput"
      responses:
        "201":
          description: Charging session and receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingCheckInResult"
        "409":
          description: Capacity reached or slot conflict
  /charging/verify-claim:
    post:
      operationId: verifyChargingClaim
      tags: [charging]
      summary: Verify a secure charging claim before collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimVerificationInput"
      responses:
        "200":
          description: Minimal staff collection verification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimVerificationResult"
        "409":
          description: Claim already used or device not ready
  /charging/{id}/status:
    patch:
      operationId: updateChargingStatus
      tags: [charging]
      summary: Update a charging session status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargingStatusInput"
      responses:
        "200":
          description: Updated charging session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSession"
  /charging/{id}/collect:
    post:
      operationId: collectChargingSession
      tags: [charging]
      summary: Verify and collect a device
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargingCollectInput"
      responses:
        "200":
          description: Collected charging session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSession"
  /workspace:
    get:
      operationId: listWorkspaceBookings
      tags: [workspace]
      summary: List current workspace bookings
      responses:
        "200":
          description: Workspace bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceBooking"
  /workspace/register:
    post:
      operationId: registerWorkspaceBooking
      tags: [workspace]
      summary: Register a workspace user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBookingInput"
      responses:
        "201":
          description: Registered workspace booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRegistrationResult"
        "409":
          description: Workspace capacity reached
  /workspace/{id}/check-in:
    post:
      operationId: checkInWorkspaceBooking
      tags: [workspace]
      summary: Check a workspace user in
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Checked-in booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBooking"
  /workspace/{id}/check-out:
    post:
      operationId: checkOutWorkspaceBooking
      tags: [workspace]
      summary: Check a workspace user out
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Checked-out booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBooking"
  /products:
    get:
      operationId: listProducts
      tags: [inventory]
      summary: List inventory products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [inventory]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List recent sales
      responses:
        "200":
          description: Sale list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a multi-item sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResult"
        "409":
          description: Insufficient inventory
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List ledger transactions
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, yesterday, week, month]
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List recent receipts
      responses:
        "200":
          description: Receipt list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: List daily operational history
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [all, charging, workspace, sales, transactions]
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Operational history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated SANFAANI application profile
      responses:
        "200":
          description: Application user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
  /customer/me:
    get:
      operationId: getCustomerMe
      tags: [customer]
      summary: Get the authenticated customer's profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomerMe
      tags: [customer]
      summary: Update the authenticated customer's profile and independent preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerProfileInput" }
      responses:
        "200":
          description: Updated customer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /customer/me/charging:
    get:
      operationId: getCustomerMyCharging
      tags: [customer]
      summary: Get only the authenticated customer's charging sessions
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [active, history, latest] }
      responses:
        "200":
          description: Customer charging activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerChargingResponse" }
  /customer/me/workspace:
    get:
      operationId: getCustomerMyWorkspace
      tags: [customer]
      summary: Get only the authenticated customer's workspace bookings
      responses:
        "200":
          description: Customer workspace bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceBooking" }
  /customer/me/receipts:
    get:
      operationId: getCustomerMyReceipts
      tags: [customer]
      summary: Get only the authenticated customer's receipts
      responses:
        "200":
          description: Customer receipts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Receipt" }
  /customer/me/receipts/{id}:
    get:
      operationId: getCustomerMyReceiptDetail
      tags: [customer, receipts]
      summary: Get one receipt owned by the authenticated customer
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Owned customer receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /customer/me/notifications:
    get:
      operationId: getCustomerMyNotifications
      tags: [customer, notifications]
      summary: Get only the authenticated customer's notifications
      responses:
        "200":
          description: Customer notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /customer/me/notifications/{id}/read:
    patch:
      operationId: markCustomerNotificationRead
      tags: [customer, notifications]
      summary: Mark one owned notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifications]
      summary: Get the browser push VAPID public key
      responses:
        "200":
          description: Public browser push configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushPublicKey" }
  /push/subscriptions:
    post:
      operationId: createPushSubscription
      tags: [notifications]
      summary: Store a deliberate browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "201":
          description: Subscription stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionState" }
    delete:
      operationId: deletePushSubscription
      tags: [notifications]
      summary: Remove this browser's push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushUnsubscribeInput" }
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionState" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the authenticated application user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a visible notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get SANFAANI settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update administrator-authorized settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff and administrators
      responses:
        "200":
          description: Staff users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
  /staff/{id}/role:
    patch:
      operationId: updateStaffRole
      tags: [staff]
      summary: Change a user role and record its audit history
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdateInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
                schema: { $ref: "#/components/schemas/AppUser" }
  /staff/{id}/active:
    patch:
      operationId: updateStaffActive
      tags: [staff]
      summary: Activate or deactivate an application user while preserving history
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveUpdateInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [inventory]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdateInput" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}/adjust:
    post:
      operationId: adjustProductStock
      tags: [inventory]
      summary: Atomically adjust product stock without allowing negative inventory
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /receipts/{id}:
    get:
      operationId: getReceiptDetail
      tags: [receipts]
      summary: Get one authorized receipt by identifier or receipt number
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    AppUser:
      type: object
      required: [id, appUserId, email, role]
      properties:
        id: { type: string, description: Supabase user id }
        appUserId: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        role: { type: string, enum: [admin, staff, customer] }
        customerId: { type: [string, "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, title, message, type, read, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        type: { type: string, enum: [charging_ready, charging_reminder, workspace_available, low_stock, system] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerChargingResponse:
      type: object
      required: [recentSessions]
      properties:
        activeSession: { oneOf: [{ $ref: "#/components/schemas/ChargingSession" }, { type: "null" }] }
        recentSessions:
          type: array
          items: { $ref: "#/components/schemas/ChargingSession" }
    Settings:
      type: object
      required: [id, businessName, currency, chargingCapacity, workspaceCapacity, defaultChargingPrice, defaultWorkspacePrice, businessTimezone]
      properties:
        id: { type: string }
        businessName: { type: string }
        businessAddress: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        currency: { type: string }
        chargingCapacity: { type: number }
        workspaceCapacity: { type: number }
        defaultChargingPrice: { type: number }
        defaultWorkspacePrice: { type: number }
        whatsappGroupInviteUrl: { type: [string, "null"] }
        businessTimezone: { type: string }
        receiptFooter: { type: [string, "null"] }
    SettingsInput:
      type: object
      required: [businessName, currency, chargingCapacity, workspaceCapacity, defaultChargingPrice, defaultWorkspacePrice, businessTimezone]
      properties:
        businessName: { type: string }
        businessAddress: { type: string }
        phone: { type: string }
        currency: { type: string }
        chargingCapacity: { type: number, minimum: 1 }
        workspaceCapacity: { type: number, minimum: 1 }
        defaultChargingPrice: { type: number, minimum: 0 }
        defaultWorkspacePrice: { type: number, minimum: 0 }
        whatsappGroupInviteUrl: { type: string }
        businessTimezone: { type: string }
        receiptFooter: { type: string }
    RoleUpdateInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, staff, customer] }
    ActiveUpdateInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    ProductUpdateInput:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        costPrice: { type: number, minimum: 0 }
        sellingPrice: { type: number, minimum: 0 }
        reorderThreshold: { type: number, minimum: 0 }
        active: { type: boolean }
    StockAdjustmentInput:
      type: object
      required: [quantity, reason]
      properties:
        quantity: { type: number, description: Non-zero integer adjustment }
        type: { type: string, enum: [restock, write-off, correction, return, other] }
        reason: { type: string }
        note: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Customer:
      type: object
      required: [id, name, whatsappOptIn, notificationPreferences, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        accountStatus: { type: string, enum: [active, inactive] }
        whatsappOptIn: { type: boolean }
        notificationPreferences:
          $ref: "#/components/schemas/NotificationPreferences"
        createdAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        email: { type: string }
        whatsappOptIn: { type: boolean }
        notificationPreferences:
          $ref: "#/components/schemas/NotificationPreferences"
    CustomerProfileInput:
      type: object
      required: [name, phone, whatsappOptIn, notificationPreferences]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 24, pattern: '^\\+?[0-9][0-9\\s-]{6,23}$' }
        whatsappOptIn: { type: boolean }
        notificationPreferences:
          type: object
          required: [inApp, chargingReminders, workspaceAvailability]
          properties:
            inApp: { type: boolean }
            chargingReminders: { type: boolean }
            workspaceAvailability: { type: boolean }
    NotificationPreferences:
      type: object
      required: [push, inApp, chargingReminders, workspaceAvailability]
      properties:
        push: { type: boolean }
        inApp: { type: boolean }
        chargingReminders: { type: boolean, default: true }
        workspaceAvailability: { type: boolean, default: false }
    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: [string, "null"] }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
    PushSubscriptionState:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PushUnsubscribeInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri }
    Product:
      type: object
      required: [id, sku, name, category, costPrice, sellingPrice, quantityOnHand, reorderThreshold, active, updatedAt]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        category: { type: string }
        costPrice: { type: number }
        sellingPrice: { type: number }
        quantityOnHand: { type: number }
        reorderThreshold: { type: number }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [sku, name, category, costPrice, sellingPrice, quantityOnHand, reorderThreshold]
      properties:
        sku: { type: string, minLength: 2 }
        name: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        costPrice: { type: number, minimum: 0 }
        sellingPrice: { type: number, minimum: 0 }
        quantityOnHand: { type: number, minimum: 0 }
        reorderThreshold: { type: number, minimum: 0 }
    ChargingSession:
      type: object
      required: [id, customerId, customerName, publicSessionId, device, slotNumber, timeIn, status, amount, paymentStatus]
      properties:
        id: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        publicSessionId: { type: string }
        device:
          $ref: "#/components/schemas/Device"
        slotNumber: { type: number }
        timeIn: { type: string, format: date-time }
        estimatedReadyAt: { type: ["string", "null"], format: date-time }
        readyAt: { type: ["string", "null"], format: date-time }
        collectedAt: { type: ["string", "null"], format: date-time }
        status:
          type: string
          enum: [checked-in, charging, ready, collected, cancelled]
        amount: { type: number }
        paymentStatus:
          type: string
          enum: [pending, paid]
        paymentMethod: { type: string }
    Device:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [phone, laptop, tablet, powerbank, other]
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    ChargingCheckInInput:
      type: object
      required: [customerName, phone, deviceType, expectedMinutes, amount, paymentMethod]
      properties:
        customerName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        deviceType:
          type: string
          enum: [phone, laptop, tablet, powerbank, other]
        brand: { type: string }
        model: { type: string }
        color: { type: string }
        description: { type: string }
        expectedMinutes: { type: number, minimum: 1, maximum: 1440 }
        amount: { type: number, minimum: 0 }
        paymentMethod:
          type: string
          enum: [cash, transfer, card, other]
    ChargingCheckInResult:
      type: object
      required: [session, receipt]
      properties:
        session: { $ref: "#/components/schemas/ChargingSession" }
        receipt: { $ref: "#/components/schemas/Receipt" }
    ChargingStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [checked-in, charging, ready, cancelled]
    ChargingCollectInput:
      type: object
      required: [claimId]
      properties:
        claimId: { type: string, minLength: 8 }
    ClaimVerificationInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
    ClaimVerificationResult:
      type: object
      required: [sessionId, claimId, device, slotNumber, status, eligibleForCollection]
      properties:
        sessionId: { type: string }
        claimId: { type: string }
        customerName: { type: [string, "null"] }
        device: { $ref: "#/components/schemas/Device" }
        slotNumber: { type: number }
        status: { type: string, enum: [ready] }
        readyAt: { type: [string, "null"], format: date-time }
        eligibleForCollection: { type: boolean }
    WorkspaceBooking:
      type: object
      required: [id, customerId, customerName, status, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        phone: { type: ["string", "null"] }
        deviceInfo: { $ref: "#/components/schemas/DeviceInfo" }
        seatNumber: { type: number }
        timeIn: { type: ["string", "null"], format: date-time }
        timeOut: { type: ["string", "null"], format: date-time }
        amount: { type: number }
        status:
          type: string
          enum: [registered, checked-in, checked-out, cancelled]
        createdAt: { type: string, format: date-time }
    DeviceInfo:
      type: object
      properties:
        type: { type: string }
        brand: { type: string }
        model: { type: string }
    WorkspaceBookingInput:
      type: object
      required: [customerName, phone]
      properties:
        customerName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        email: { type: string }
        deviceInfo: { $ref: "#/components/schemas/DeviceInfo" }
        amount: { type: number, minimum: 0 }
        paymentMethod: { type: string, enum: [cash, transfer, card, other] }
        whatsappOptIn: { type: boolean }
    WorkspaceRegistrationResult:
      type: object
      required: [booking]
      properties:
        booking: { $ref: "#/components/schemas/WorkspaceBooking" }
        receipt: { oneOf: [{ $ref: "#/components/schemas/Receipt" }, { type: "null" }] }
        whatsappGroupInviteUrl: { type: [string, "null"] }
    Sale:
      type: object
      required: [id, total, paymentMethod, itemCount, createdAt]
      properties:
        id: { type: string }
        customerId: { type: ["string", "null"] }
        itemCount: { type: number }
        total: { type: number }
        paymentMethod: { type: string }
        createdAt: { type: string, format: date-time }
    SaleInput:
      type: object
      required: [items, paymentMethod]
      properties:
        customerId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: number, minimum: 1 }
        paymentMethod:
          type: string
          enum: [cash, transfer, card, other]
    SaleResult:
      type: object
      required: [sale, receipt]
      properties:
        sale: { $ref: "#/components/schemas/Sale" }
        receipt: { $ref: "#/components/schemas/Receipt" }
    Transaction:
      type: object
      required: [id, type, amount, direction, paymentMethod, description, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        amount: { type: number }
        direction: { type: string, enum: [income, expense] }
        paymentMethod: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    Receipt:
      type: object
      required: [id, receiptNumber, type, subtotal, total, paymentMethod, generatedAt]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        type: { type: string, enum: [sale, charging, workspace] }
        customerName: { type: ["string", "null"] }
        referenceId: { type: string }
        claimId: { type: ["string", "null"] }
        claimToken: { type: ["string", "null"], description: Authorized receipt detail only; omitted from lists }
        subtotal: { type: number }
        total: { type: number }
        paymentMethod: { type: string }
        details:
          type: [object, "null"]
          additionalProperties: true
        generatedAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [todayRevenue, charging, workspace, lowStockCount, todayCustomers, recentTransactions, readySessions, lowStockProducts]
      properties:
        todayRevenue: { type: number }
        charging:
          type: object
          required: [active, capacity, available]
          properties:
            active: { type: number }
            capacity: { type: number }
            available: { type: number }
        workspace:
          type: object
          required: [occupied, capacity, available]
          properties:
            occupied: { type: number }
            capacity: { type: number }
            available: { type: number }
        lowStockCount: { type: number }
        todayCustomers: { type: number }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        readySessions:
          type: array
          items: { $ref: "#/components/schemas/ChargingSession" }
        lowStockProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
    HistoryResponse:
      type: object
      required: [date, summary, transactions, charging, workspace, sales, records, pagination]
      properties:
        date: { type: string, format: date }
        summary:
          type: object
          required: [chargingCount, workspaceCount, salesCount, revenue]
          properties:
            chargingCount: { type: number }
            workspaceCount: { type: number }
            salesCount: { type: number }
            revenue: { type: number }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        charging:
          type: array
          items: { $ref: "#/components/schemas/ChargingSession" }
        workspace:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceBooking" }
        sales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        records:
          type: array
          items: { $ref: "#/components/schemas/HistoryRecord" }
        pagination:
          $ref: "#/components/schemas/Pagination"
    HistoryRecord:
      type: object
      required: [kind, timestamp, record]
      properties:
        kind: { type: string, enum: [charging, workspace, sales, transactions] }
        timestamp: { type: string, format: date-time }
        record:
          oneOf:
            - $ref: "#/components/schemas/ChargingSession"
            - $ref: "#/components/schemas/WorkspaceBooking"
            - $ref: "#/components/schemas/Sale"
            - $ref: "#/components/schemas/Transaction"
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: number }
        limit: { type: number }
        total: { type: number }
        pages: { type: number }
