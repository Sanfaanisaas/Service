kind = "web"
previewPath = "/"
title = "SANFAANI Operations"
description = "A production-oriented operations platform for SANFAANI, combining charging management, workspace capacity, inventory, sales, bookkeeping, receipts, history, and customer access in one dependable system."
version = "1.0.0"
id = "artifacts/sanfaani-operations"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22469

[services.development]
run = "pnpm --filter @workspace/sanfaani-operations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sanfaani-operations", "run", "build" ]
serve = "static"
publicDir = "artifacts/sanfaani-operations/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22469"
BASE_PATH = "/"
